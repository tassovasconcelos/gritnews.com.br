name: Sr. Padeiro CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/sr-padeiro/**'
      - '.github/workflows/sr-padeiro-ci.yml'
  pull_request:
    paths:
      - 'apps/sr-padeiro/**'
      - '.github/workflows/sr-padeiro-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sr-padeiro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sr-padeiro
    env:
      VITE_SUPABASE_URL: https://pcrwtoddavpvkaxwtstc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SRP_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_URL: https://srpadeiro.gritnews.com.br
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Smoke test
        run: npm run smoke
