name: Link União — domínio e login isolados
on:
  push:
    branches: [main]
    paths:
      - 'apps/link-uniao/**'
      - 'server.ts'
      - 'ops/build-hosted-app.mjs'
      - '.github/workflows/link-uniao-host-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Testar roteamento independente e login
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=31990 node dist/server.cjs > /tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 18); do
            if curl -fsS --max-time 2 -H 'Host: uniao.gritnews.com.br' http://127.0.0.1:31990/health > /tmp/lu-health.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/lu-health.json'))
          assert h.get('ok') is True and h.get('app') == 'grit-link-uniao-360',h
          print('Domínio Link União reconhecido pelo host router.')
          PY
          curl -fsS -H 'Host: uniao.gritnews.com.br' http://127.0.0.1:31990/login > /tmp/lu-login.html
          grep -q 'Painel administrativo' /tmp/lu-login.html
          grep -q 'Entrar no painel' /tmp/lu-login.html
          curl -fsS -H 'Host: uniao.gritnews.com.br' http://127.0.0.1:31990/admin > /tmp/lu-admin.html
          grep -q 'GRIT RADAR 360°' /tmp/lu-admin.html
          curl -fsS -H 'Host: uniao.gritnews.com.br' http://127.0.0.1:31990/equipe > /tmp/lu-equipe.html
          grep -q 'Pesquisa de clima' /tmp/lu-equipe.html
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: uniao.gritnews.com.br' http://127.0.0.1:31990/server.ts)
          test "$STATUS" = '404'
          echo "Login, painel, equipe e isolamento passaram."
