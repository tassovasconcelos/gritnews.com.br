name: Site Governance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'ops/sites.json'
      - 'ops/search_console.py'
      - 'apps/gritnews/public/**'
      - 'apps/meu-espetinho/public/**'
      - '.github/workflows/site-governance.yml'
  push:
    branches: [main]
    paths:
      - 'ops/sites.json'
      - 'ops/search_console.py'
      - 'apps/gritnews/public/**'
      - 'apps/meu-espetinho/public/**'
      - '.github/workflows/site-governance.yml'

permissions:
  contents: read

jobs:
  health-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Check site availability
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.[]' ops/sites.json | while read -r site; do
            name=$(jq -r '.name' <<<"$site")
            url=$(jq -r '.url' <<<"$site")
            echo "Checking $name -> $url"
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 25 "$url")
            if [[ "$code" -lt 200 || "$code" -ge 400 ]]; then
              echo "::error title=Site unavailable::$name returned HTTP $code ($url)"
              exit 1
            fi
          done

      - name: Validate robots and sitemaps for public sites
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.[] | select(.public_index == true)' ops/sites.json | while read -r site; do
            name=$(jq -r '.name' <<<"$site")
            robots=$(jq -r '.robots' <<<"$site")
            sitemap=$(jq -r '.sitemap' <<<"$site")

            echo "Validating SEO discovery for $name"
            robots_body=$(curl -L -fsS --connect-timeout 10 --max-time 25 "$robots")
            sitemap_body=$(curl -L -fsS --connect-timeout 10 --max-time 25 "$sitemap")

            grep -qi '^User-agent:' <<<"$robots_body" || {
              echo "::error title=Invalid robots.txt::$robots has no User-agent directive"; exit 1;
            }
            grep -Fqi "$sitemap" <<<"$robots_body" || {
              echo "::warning title=Sitemap not declared::$robots does not reference $sitemap";
            }
            grep -Eq '<(urlset|sitemapindex)([ >])' <<<"$sitemap_body" || {
              echo "::error title=Invalid sitemap::$sitemap is not a valid sitemap document"; exit 1;
            }
          done

      - name: Report security headers
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.[]' ops/sites.json | while read -r site; do
            name=$(jq -r '.name' <<<"$site")
            url=$(jq -r '.url' <<<"$site")
            headers=$(curl -L -sSI --connect-timeout 10 --max-time 25 "$url" | tr -d '\r')
            echo "--- $name ---"
            for header in x-content-type-options referrer-policy content-security-policy strict-transport-security permissions-policy; do
              if grep -qi "^${header}:" <<<"$headers"; then
                grep -i "^${header}:" <<<"$headers" | tail -1
              else
                echo "::warning title=Security header missing::$name does not expose $header"
              fi
            done
          done

      - name: Prepare Search Console client
        if: github.event_name != 'pull_request' && env.GSC_SERVICE_ACCOUNT_JSON != ''
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Submit sitemaps to Google Search Console
        if: github.event_name != 'pull_request' && env.GSC_SERVICE_ACCOUNT_JSON != ''
        env:
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ env.GSC_SERVICE_ACCOUNT_JSON }}
        run: python ops/search_console.py

      - name: Search Console credential status
        if: github.event_name != 'pull_request' && env.GSC_SERVICE_ACCOUNT_JSON == ''
        run: |
          echo '::warning title=Search Console not authenticated::Repository secret GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON is not configured.'
          echo '- ⚠️ Search Console API pending: configure `GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON`.' >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          echo '### Site Governance' >> "$GITHUB_STEP_SUMMARY"
          echo '- Availability checked for all inventoried sites.' >> "$GITHUB_STEP_SUMMARY"
          echo '- robots.txt and sitemap validated for public/indexable sites.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Security headers inspected and missing headers reported as warnings.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authenticated Search Console submission is enabled when the repository secret is configured.' >> "$GITHUB_STEP_SUMMARY"
