name: GRIT Prospect 360 CI

on:
  push:
    branches:
      - feat/grit-prospect-360-mvp-foundation-20260921
    paths:
      - 'apps/grit-prospect-360/**'
      - '.github/workflows/grit-prospect-360-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/grit-prospect-360/**'
      - '.github/workflows/grit-prospect-360-ci.yml'

permissions:
  contents: read

jobs:
  company-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/grit-prospect-360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test company import and deduplication
        run: npm test
      - name: Verify staged schema has org isolation and RLS
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ALTER TABLE public.companies ENABLE ROW LEVEL SECURITY' db/migrations/0001_initial.sql
          grep -q 'UNIQUE (organization_id, tax_id)' db/migrations/0001_initial.sql
          grep -q 'CREATE POLICY "companies_insert_operators"' db/migrations/0001_initial.sql
          grep -q 'SECURITY INVOKER' db/migrations/0002_import_rpc.sql
          grep -q 'REVOKE ALL ON FUNCTION public.apply_company_import' db/migrations/0002_import_rpc.sql
          grep -q 'UNIQUE (organization_id, file_sha256)' db/migrations/0002_import_rpc.sql
          grep -q 'SECURITY INVOKER' db/migrations/0004_first_owner.sql
          grep -q 'REVOKE ALL ON FUNCTION public.bootstrap_first_owner' db/migrations/0004_first_owner.sql
          grep -q 'ALTER TABLE public.social_prospect_candidates ENABLE ROW LEVEL SECURITY' db/migrations/0005_social_company_prospects.sql
          grep -q 'CHECK(outbound_enabled = false)' db/migrations/0005_social_company_prospects.sql
          grep -q 'REVOKE ALL ON TABLE public.social_prospect_candidates' db/migrations/0005_social_company_prospects.sql
          echo "Static migration checks passed. Database migration NOT applied."

  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install existing monorepo dependencies
        run: pnpm install --frozen-lockfile
      - name: Build isolated frontend (without project credentials)
        run: pnpm exec vite build --config apps/grit-prospect-360/web/vite.config.mjs
      - name: Verify frontend artifact
        run: |
          set -euo pipefail
          test -s apps/grit-prospect-360/web/dist/index.html
          test -d apps/grit-prospect-360/web/dist/assets
          echo "Frontend artifact built. No deploy performed."
