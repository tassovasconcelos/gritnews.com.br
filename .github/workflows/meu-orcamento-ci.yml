name: Meu Orcamento CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/meu-orcamento/**'
      - '.github/workflows/meu-orcamento-ci.yml'
  pull_request:
    paths:
      - 'apps/meu-orcamento/**'
      - '.github/workflows/meu-orcamento-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/meu-orcamento
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
