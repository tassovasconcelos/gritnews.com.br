name: GRIT Auto Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate and build
        shell: bash
        run: |
          set -e
          if [ -f package.json ]; then
            pnpm install --frozen-lockfile
            pnpm run test:security
            pnpm run build
          else
            echo "No root package.json; repository validation skipped."
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger optional hosting hook
        env:
          HOSTINGER_DEPLOY_HOOK: ${{ secrets.HOSTINGER_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -n "$HOSTINGER_DEPLOY_HOOK" ]; then
            curl --fail --show-error --silent --retry 3 -X POST "$HOSTINGER_DEPLOY_HOOK"
          else
            echo "Using the existing Hostinger GitHub auto-deploy integration."
          fi

      - name: Verify GRIT News production security release
        shell: bash
        run: |
          set -e
          URL="https://gritnews.com.br/security-release.json"
          for attempt in $(seq 1 24); do
            BODY="$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "$URL?commit=${GITHUB_SHA}" 2>/dev/null || true)"
            if echo "$BODY" | grep -q "$GITHUB_SHA"; then
              echo "Production verified: current GRIT News commit is online."
              exit 0
            fi
            echo "Waiting for Hostinger deployment ($attempt/24)..."
            sleep 15
          done
          echo "::error::GRIT News has not published this commit. Check the Hostinger deployment logs."
          exit 1
