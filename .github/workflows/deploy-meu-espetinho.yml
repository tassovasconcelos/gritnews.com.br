name: Deploy Meu Espetinho

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/meu-espetinho/**'
      - '.github/workflows/deploy-meu-espetinho.yml'

concurrency:
  group: deploy-meu-espetinho-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production-meu-espetinho

    defaults:
      run:
        working-directory: apps/meu-espetinho

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/meu-espetinho/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.MEU_ESPETINHO_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MEU_ESPETINHO_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Validate build
        run: test -f dist/index.html

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MEU_ESPETINHO_FTP_SERVER }}
          username: ${{ secrets.MEU_ESPETINHO_FTP_USERNAME }}
          password: ${{ secrets.MEU_ESPETINHO_FTP_PASSWORD }}
          protocol: ftps
          local-dir: apps/meu-espetinho/dist/
          server-dir: ${{ secrets.MEU_ESPETINHO_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
