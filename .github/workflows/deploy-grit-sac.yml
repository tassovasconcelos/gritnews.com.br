name: Deploy APP GRIT SAC 4.0 (SACPROH)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci || npm install

      - name: 🔍 Validar Código TypeScript
        run: npm run lint

      - name: 🏗️ Compilar Projeto para /sacproh (GRIT SAC 4.0)
        env:
          VITE_BASE_PATH: '/sacproh/'
          NODE_ENV: 'production'
        run: npm run build

      - name: 📤 Armazenar Artefato de Build (ZIP/Dist)
        uses: actions/upload-artifact@v4
        with:
          name: grit-sacproh-build
          path: dist/
          retention-days: 14

      - name: 🚀 Publicar via FTP no Servidor Hostinger (gritnews.com.br/sacproh)
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/sacproh/
          local-dir: dist/
          dangerous-clean-slate: false

