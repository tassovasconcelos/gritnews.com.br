name: CI Validação GRIT NEWS

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches-ignore: [ main, master ]

permissions:
  contents: read

jobs:
  legacy-root:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Root lint
        continue-on-error: true
        run: pnpm run lint
      - name: Root build
        run: pnpm run build

  meu-espetinho:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/meu-espetinho
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Meu Espetinho
        run: pnpm install --frozen-lockfile
      - name: Build Meu Espetinho
        run: pnpm run build
      - name: Smoke Meu Espetinho
        run: pnpm run smoke
