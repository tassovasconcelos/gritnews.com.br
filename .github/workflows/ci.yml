name: CI Validação GRIT NEWS

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches-ignore: [ main, master ]

permissions:
  contents: read

jobs:
  legacy-root:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Root lint
        continue-on-error: true
        run: npm run lint
      - name: Root build
        run: npm run build

  meu-espetinho:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/meu-espetinho
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Meu Espetinho
        run: npm install --no-audit --no-fund
      - name: Build Meu Espetinho
        run: npm run build
      - name: Smoke Meu Espetinho
        run: npm run smoke
