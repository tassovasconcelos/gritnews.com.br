name: Link União — teste positivo único
on:
  push:
    branches: [main]
    paths: ['.github/workflows/link-uniao-positive-once.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Registrar e confirmar uma resposta fictícia identificada como teste
        shell: bash
        run: |
          set -euo pipefail
          END="https://pcrwtoddavpvkaxwtstc.supabase.co/functions/v1/link-uniao-surveys"
          curl -fsSL --max-time 20 "$END" > /tmp/status.json
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/status.json'))
          assert v.get('ok') is True and v.get('open') is True,v
          print('Campaign confirmed open')
          PY
          python3 - <<'PY'
          import json,os
          data={"action":"staff_submit","consent":True,"area":"nao_informado","ratings":{f"{d}{n}":3 for d in "ABCDEF" for n in (1,2,3)},"enps":5,"motivation":5,"comment_good":"LU_TESTE_CONTROLE_"+os.getenv("GITHUB_SHA","")[:12],"comment_change":"Respostas fictícias; excluir após teste."}
          open('/tmp/test.json','w').write(json.dumps(data))
          PY
          code=$(curl -sS --max-time 20 -o /tmp/response.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @/tmp/test.json "$END")
          echo "Result HTTP $code"
          cat /tmp/response.json
          echo
          test "$code" = "200"
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/response.json'))
          assert v.get('ok') and v.get('submitted'),v
          print('Write path confirmed. Test row must now be deleted.')
          PY
