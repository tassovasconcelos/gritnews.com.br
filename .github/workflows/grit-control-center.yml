name: GRIT Control Center

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'ops/**'
      - 'public/produtos/**'
      - 'public/sitemap*.xml'
      - 'public/robots.txt'
      - 'apps/gritnews/public/control-center/**'
      - 'apps/gritnews/src/components/admin/AdminControlCenter*.tsx'
      - '.github/workflows/grit-control-center.yml'
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - 'public/produtos/**'
      - 'public/sitemap*.xml'
      - 'public/robots.txt'
      - 'apps/gritnews/src/components/admin/AdminControlCenter*.tsx'
      - '.github/workflows/grit-control-center.yml'

permissions:
  contents: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Prepare monitor
        run: python -m pip install --disable-pip-version-check requests

      - name: Audit all GRIT projects
        run: python ops/control_center.py

      - name: Validate commercial indexing assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/sitemap.xml
          test -f public/sitemap-commercial.xml
          test -f public/robots.txt
          test -f public/produtos/index.html
          test -f public/produtos/meu-orcamento/index.html
          test -f public/produtos/grit-propostas/index.html
          grep -q 'produtos/meu-orcamento' public/sitemap-commercial.xml
          grep -q 'sitemap-commercial.xml' public/robots.txt
          echo 'Commercial indexing assets validated.'

      - name: Authenticate to Google Cloud with GitHub OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/785282249475/locations/global/workloadIdentityPools/github-grit/providers/github-grit
          service_account: grit-search-console@gen-lang-client-0354992661.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Prepare Search Console client
        if: github.event_name != 'pull_request'
        run: python -m pip install --disable-pip-version-check google-auth

      - name: Submit public sitemaps to Search Console
        if: github.event_name != 'pull_request'
        run: python ops/search_console.py

      - name: Persist sanitized admin snapshot
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'grit-control-center[bot]'
          git config user.email 'grit-control-center@users.noreply.github.com'
          git add apps/gritnews/public/control-center/status.json
          if git diff --cached --quiet; then
            echo 'No dashboard snapshot changes.'
            exit 0
          fi
          git commit -m 'chore(control-center): refresh admin status snapshot [skip ci]'
          git push origin HEAD:main

      - name: Upload private control-center report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grit-control-center-${{ github.run_number }}
          path: |
            artifacts/grit-control-center.json
            artifacts/grit-control-center.html
          retention-days: 30
          if-no-files-found: warn
