name: GRIT Control Center

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'ops/**'
      - '.github/workflows/grit-control-center.yml'
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - '.github/workflows/grit-control-center.yml'

permissions:
  contents: read
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Prepare monitor
        run: python -m pip install --disable-pip-version-check requests

      - name: Audit all GRIT projects
        run: python ops/control_center.py

      - name: Authenticate to Google Cloud with GitHub OIDC
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/785282249475/locations/global/workloadIdentityPools/github-grit/providers/github-grit
          service_account: grit-search-console@gen-lang-client-0354992661.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Prepare Search Console client
        if: github.event_name != 'pull_request'
        run: python -m pip install --disable-pip-version-check google-auth

      - name: Submit public sitemaps to Search Console
        if: github.event_name != 'pull_request'
        run: python ops/search_console.py

      - name: Upload private control-center report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grit-control-center-${{ github.run_number }}
          path: |
            artifacts/grit-control-center.json
            artifacts/grit-control-center.html
          retention-days: 30
          if-no-files-found: warn
