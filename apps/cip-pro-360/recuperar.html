<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
 <title>Redefinir senha | GRIT</title>
 <style>
 *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1222;color:#eaf0ff;font:16px/1.5 Arial,sans-serif}.card{width:min(100%,440px);padding:30px;border:1px solid #29364e;border-radius:20px;background:#131e32}.brand{font-size:25px;font-weight:800;color:#8cb8ff;letter-spacing:2px}h1{font-size:27px;line-height:1.2}p{color:#b9c8e0}label{display:block;margin-top:18px;font-size:14px;font-weight:bold}input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #587198;border-radius:9px;background:#0b1222;color:white;font:inherit}button,.button{display:block;width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#327bf5;color:white;font:inherit;font-weight:bold;text-align:center;text-decoration:none}button:disabled{opacity:.6}a{color:#a8cbff}.hidden{display:none!important}#message{min-height:26px}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ffdc55;outline-offset:3px}.small{font-size:13px}
 </style>
</head>
<body>
 <main class="card">
  <div class="brand">GRIT</div>
  <h1>Redefinir senha</h1>
  <p>Defina a senha da sua conta GRIT, usada nos aplicativos conectados.</p>
  <p id="recoveryAccount" class="small"></p>
  <p id="message" role="status" aria-live="polite">Validando seu link de recuperação…</p>
  <form id="recoveryForm" class="hidden">
   <label for="newPassword">Nova senha<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label>
   <label for="confirmPassword">Confirmar nova senha<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label>
   <p class="small">Use pelo menos 12 caracteres. A senha não é enviada por e-mail.</p>
   <button id="savePassword" type="submit">Salvar nova senha</button>
  </form>
  <a id="returnLink" class="button hidden" href="./">Voltar ao CIP e entrar</a>
  <p class="small">Link expirado? <a href="./">Volte ao CIP e solicite uma nova recuperação.</a></p>
 </main>
 <script type="module" src="./grit-recovery.js?v=grit-recovery-20261018-account"></script>
</body>
</html>
