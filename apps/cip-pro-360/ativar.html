<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Ativar acesso | CIP PRO 360°</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3f4;font:16px/1.6 Arial,sans-serif;padding:20px;color:#29253a}.card{width:min(100%,480px);background:white;border:1px solid #e2dce0;border-radius:20px;padding:28px}img{width:170px}h1{font-size:26px}label{display:block;font-weight:bold;margin-top:15px}input{width:100%;padding:12px;border:1px solid #aaa;border-radius:8px;font:inherit}button,a{display:inline-block;margin-top:18px;padding:12px;background:#a71931;color:white;border:0;border-radius:8px;font:inherit;text-decoration:none}button:disabled{opacity:.6}.hidden{display:none!important}.mini{font-size:13px;color:#65616d}:focus-visible{outline:3px solid #f2c900;outline-offset:3px}input[type="password"]::-ms-reveal,input[type="password"]::-ms-clear{display:none}
</style></head><body><main class="card"><img src="./logo-grupo-prohospital.jpg" alt="Grupo Prohospital"><h1>Ativar acesso ao CIP</h1><p id="activationAccount"></p><p id="activationScope" class="mini"></p><p id="activationStatus" role="status">Validando o convite…</p><form id="activationForm" class="hidden"><label id="passwordLabel" for="activationPassword">Senha<input id="activationPassword" type="password" autocomplete="current-password" required></label><label id="confirmationLabel" class="hidden" for="activationConfirm">Confirmar nova senha<input id="activationConfirm" type="password" autocomplete="new-password"></label><p class="mini" id="activationHelp"></p><button type="submit">Ativar meu acesso</button></form><a id="activationReturn" class="hidden" href="./">Ir para o CIP</a></main><script type="module" src="./cip-activation.js"></script></body></html>
