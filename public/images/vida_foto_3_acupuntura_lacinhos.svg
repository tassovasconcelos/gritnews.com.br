<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </linearGradient>
    <linearGradient id="dogFurClose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF8EC"/>
      <stop offset="100%" stop-color="#F0E2CE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#warmBg)"/>

  <!-- Close-up of Vida's Face & Head -->
  <!-- Main Head Shape -->
  <path d="M 150,120 Q 400,60 650,140 Q 720,280 650,420 Q 380,480 150,380 Q 80,260 150,120 Z" fill="url(#dogFurClose)"/>

  <!-- Soft Pink Inner Ears with Bow Clips -->
  <!-- Left Ear -->
  <path d="M 160,110 L 100,20 L 250,80 Z" fill="#EAD7BC"/>
  <path d="M 165,100 L 120,40 L 230,85 Z" fill="#F8C8DC"/>
  <!-- Left Bow Clip (Lacinho Rosa/Azul) -->
  <path d="M 190,75 Q 170,55 190,45 Q 200,60 190,75 Z" fill="#FF85A1"/>
  <path d="M 190,75 Q 210,55 190,45 Q 200,60 190,75 Z" fill="#FF85A1"/>
  <circle cx="190" cy="60" r="6" fill="#3B82F6"/>

  <!-- Right Ear -->
  <path d="M 640,120 L 720,30 L 560,90 Z" fill="#EAD7BC"/>
  <path d="M 635,110 L 700,50 L 580,95 Z" fill="#F8C8DC"/>
  <!-- Right Bow Clip -->
  <path d="M 610,85 Q 590,65 610,55 Q 620,70 610,85 Z" fill="#3B82F6"/>
  <path d="M 610,85 Q 630,65 610,55 Q 620,70 610,85 Z" fill="#3B82F6"/>
  <circle cx="610" cy="70" r="6" fill="#FF85A1"/>

  <!-- Blue Husky Eyes (Calm and peaceful) -->
  <ellipse cx="280" cy="240" rx="28" ry="20" fill="#4096EE"/>
  <circle cx="280" cy="240" r="12" fill="#0B2343"/>
  <circle cx="274" cy="234" r="5" fill="#FFFFFF"/>

  <ellipse cx="520" cy="240" rx="28" ry="20" fill="#4096EE"/>
  <circle cx="520" cy="240" r="12" fill="#0B2343"/>
  <circle cx="514" cy="234" r="5" fill="#FFFFFF"/>

  <!-- Snout and Nose -->
  <ellipse cx="400" cy="340" rx="90" ry="60" fill="#FFFFFF"/>
  <path d="M 370,320 Q 400,305 430,320 Q 440,345 400,355 Q 360,345 370,320 Z" fill="#D98A8A"/> <!-- Pink Nose -->

  <!-- Gentle Human Hand Caressing Cheek -->
  <path d="M 600,320 Q 680,280 750,340 L 780,480 L 620,480 Z" fill="#F3D3C1"/>

  <!-- Acupuncture Needles (Agulhas de Acupuntura na Testa) -->
  <!-- Needle 1 -->
  <line x1="400" y1="180" x2="400" y2="100" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="400" cy="98" r="4" fill="#E2E8F0"/>
  <circle cx="400" cy="180" r="3" fill="#EF4444"/> <!-- Acupuncture stimulation point -->

  <!-- Needle 2 -->
  <line x1="340" y1="160" x2="310" y2="85" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="308" cy="83" r="4" fill="#E2E8F0"/>
  <circle cx="340" cy="160" r="3" fill="#EF4444"/>

  <!-- Needle 3 -->
  <line x1="460" y1="160" x2="490" y2="85" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="492" cy="83" r="4" fill="#E2E8F0"/>
  <circle cx="460" cy="160" r="3" fill="#EF4444"/>

  <!-- Needle 4 (Crown point) -->
  <line x1="400" y1="130" x2="400" y2="50" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="400" cy="48" r="4" fill="#E2E8F0"/>
  <circle cx="400" cy="130" r="3" fill="#EF4444"/>

  <!-- Badge Overlay -->
  <rect x="20" y="20" width="460" height="40" rx="8" fill="#0B2343" opacity="0.9"/>
  <text x="35" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">3. Acupuntura Neuromoduladora &amp; Lacinhos</text>
</svg>
