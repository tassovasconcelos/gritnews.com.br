<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F1F5"/>
      <stop offset="100%" stop-color="#C5D8E1"/>
    </linearGradient>
    <linearGradient id="scrubGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7A5F"/>
      <stop offset="100%" stop-color="#07523F"/>
    </linearGradient>
  </defs>

  <!-- Clinic Floor -->
  <rect width="800" height="500" fill="url(#clinicBg)"/>

  <!-- Physical Therapy Mat -->
  <rect x="100" y="220" width="600" height="250" rx="20" fill="#2B5B7A"/>

  <!-- Dra. Renata Pessoa (Veterinary Specialist in Green Scrubs) -->
  <path d="M 120,180 Q 200,140 260,200 L 280,360 L 140,360 Z" fill="url(#scrubGreen)"/>
  <!-- Head & Hair -->
  <circle cx="190" cy="110" r="35" fill="#8D5524"/>
  <circle cx="190" cy="115" r="28" fill="#F3D3C1"/>
  <!-- Doctor's Face details -->
  <path d="M 175,115 Q 190,125 205,115" stroke="#7A5C43" stroke-width="2" fill="none"/>

  <!-- Vida lying on stomach during electrotherapy -->
  <!-- Body -->
  <path d="M 280,260 Q 420,240 560,280 Q 600,320 560,370 Q 420,400 280,370 Z" fill="#FFFFFF"/>
  <!-- Head turned happily -->
  <ellipse cx="580" cy="270" rx="45" ry="35" fill="#FFF8EC"/>
  <ellipse cx="615" cy="280" rx="10" ry="7" fill="#D98A8A"/> <!-- Nose -->
  <!-- Ear -->
  <path d="M 560,235 L 585,190 L 605,240 Z" fill="#EAD7BC"/>
  <!-- Happy closed eye -->
  <path d="M 575,260 Q 585,268 595,260" stroke="#5C4033" stroke-width="3" fill="none"/>

  <!-- TENS/FES Electrostimulation Equipment & Cables -->
  <!-- Electrotherapy Device Box -->
  <rect x="220" y="140" width="100" height="70" rx="10" fill="#1E293B"/>
  <rect x="235" y="150" width="70" height="30" rx="4" fill="#38BDF8"/>
  <text x="245" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#0F172A">TENS/FES</text>

  <!-- Electrodes on Vida's Hip and Back -->
  <rect x="360" y="270" width="24" height="24" rx="4" fill="#EF4444"/> <!-- Red pad 1 -->
  <rect x="420" y="265" width="24" height="24" rx="4" fill="#10B981"/> <!-- Green pad 2 -->
  <rect x="480" y="275" width="24" height="24" rx="4" fill="#EF4444"/> <!-- Red pad 3 -->

  <!-- Wires from Device to Electrodes -->
  <path d="M 270,210 Q 310,260 360,280" stroke="#EF4444" stroke-width="2.5" fill="none"/>
  <path d="M 280,210 Q 340,250 420,275" stroke="#10B981" stroke-width="2.5" fill="none"/>
  <path d="M 290,210 Q 380,260 480,285" stroke="#F59E0B" stroke-width="2.5" fill="none"/>

  <!-- Caption Bubble Overlay in Photo -->
  <rect x="320" y="60" width="440" height="60" rx="16" fill="#FFFFFF" stroke="#0D7A5F" stroke-width="3"/>
  <text x="340" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0D7A5F">"Tô fazendo minha fisioterapia, titios!"</text>
  <text x="340" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#64748B">Com Dra. Renata Pessoa (@renatapessoa.vet @dramarciasm)</text>

  <!-- Badge Overlay -->
  <rect x="20" y="20" width="480" height="40" rx="8" fill="#0B2343" opacity="0.9"/>
  <text x="35" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">4. Fisioterapia Diária &amp; Eletroestimulação TENS/FES</text>
</svg>
