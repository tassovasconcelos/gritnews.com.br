<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D1C3"/>
      <stop offset="100%" stop-color="#CBB5A1"/>
    </linearGradient>
    <linearGradient id="foam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3C878"/>
      <stop offset="100%" stop-color="#C8A848"/>
    </linearGradient>
    <linearGradient id="fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="60%" stop-color="#F7EBD3"/>
      <stop offset="100%" stop-color="#EAD1B3"/>
    </linearGradient>
  </defs>

  <!-- Background Pavement -->
  <rect width="800" height="500" fill="url(#bg1)"/>
  
  <!-- Pavement Grid Pattern -->
  <path d="M 0,300 Q 400,280 800,300 M 0,360 Q 400,340 800,360 M 0,420 Q 400,400 800,420" stroke="#B09A85" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 150,250 L 120,500 M 350,250 L 320,500 M 550,250 L 530,500 M 720,250 L 700,500" stroke="#B09A85" stroke-width="2" opacity="0.5"/>

  <!-- Trash bags and background items -->
  <path d="M 50,120 Q 120,80 180,140 Q 220,220 120,260 Q 40,240 50,120 Z" fill="#26282B"/>
  <path d="M 160,110 Q 250,70 300,150 Q 320,240 220,260 Q 140,240 160,110 Z" fill="#1C1E20"/>
  
  <!-- Blue Backpack -->
  <rect x="40" y="220" width="110" height="140" rx="20" fill="#3A7CA5"/>
  <rect x="60" y="240" width="70" height="80" rx="10" fill="#2B5B7A"/>
  <path d="M 40,320 L 150,320" stroke="#8C6239" stroke-width="12" stroke-linecap="round"/>

  <!-- Torn Yellow Foam Mattress -->
  <path d="M 220,180 L 750,300 L 680,480 L 150,340 Z" fill="url(#foam)"/>
  <!-- Mattress tear detail -->
  <path d="M 620,400 Q 640,430 670,410 Q 650,460 620,440 Z" fill="#9E7E2C"/>
  <!-- Blue cord on mattress -->
  <path d="M 280,220 Q 420,380 540,430" stroke="#1D63B8" stroke-width="4" fill="none"/>

  <!-- Lying Dog: Vida -->
  <!-- Body -->
  <path d="M 260,250 Q 380,210 520,280 Q 580,320 560,370 Q 480,400 320,350 Q 240,310 260,250 Z" fill="url(#fur)"/>
  <!-- Legs stretched out -->
  <path d="M 480,340 L 620,370 Q 630,380 610,385 L 470,360 Z" fill="#F7EBD3"/>
  <path d="M 450,350 L 590,395 Q 600,405 580,410 L 440,370 Z" fill="#EAD1B3"/>
  <!-- Tail -->
  <path d="M 260,280 Q 200,320 220,360 Q 250,350 270,310 Z" fill="#FFFDF9"/>
  <!-- Head lying flat -->
  <path d="M 500,280 Q 560,270 590,300 Q 580,320 520,310 Z" fill="#FFFDF9"/>
  <!-- Snout & Nose -->
  <ellipse cx="585" cy="305" rx="12" ry="8" fill="#D98A8A"/>
  <!-- Ear -->
  <path d="M 500,265 L 530,220 L 540,270 Z" fill="#EAD1B3"/>
  <!-- Closed sad eyes -->
  <path d="M 545,285 Q 555,290 565,285" stroke="#7A5C43" stroke-width="3" fill="none"/>

  <!-- Badge Overlay -->
  <rect x="20" y="20" width="340" height="40" rx="8" fill="#0B2343" opacity="0.9"/>
  <text x="35" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">1. O Resgate na Praça • Julho/2023</text>
</svg>
