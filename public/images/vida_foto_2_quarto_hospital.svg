<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="evaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B72D2"/>
      <stop offset="100%" stop-color="#1B4D93"/>
    </linearGradient>
    <linearGradient id="evaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28D35"/>
      <stop offset="100%" stop-color="#D96B14"/>
    </linearGradient>
    <linearGradient id="donutPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF85A1"/>
      <stop offset="100%" stop-color="#E64A72"/>
    </linearGradient>
    <linearGradient id="fur2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF0DD"/>
      <stop offset="100%" stop-color="#EAD7BC"/>
    </linearGradient>
  </defs>

  <!-- EVA Mat Flooring -->
  <rect width="800" height="500" fill="url(#evaBlue)"/>
  <rect x="550" y="0" width="250" height="500" fill="url(#evaOrange)"/>
  
  <!-- EVA Interlocking Teeth line -->
  <path d="M 550,0 L 550,50 L 530,70 L 550,90 L 550,140 L 530,160 L 550,180 L 550,230 L 530,250 L 550,270 L 550,320 L 530,340 L 550,360 L 550,410 L 530,430 L 550,450 L 550,500" stroke="#153E77" stroke-width="4" fill="none"/>

  <!-- Donut Cushion (Almofada de Rosquinha Rosa) -->
  <ellipse cx="680" cy="220" rx="90" ry="70" fill="url(#donutPink)"/>
  <ellipse cx="680" cy="220" rx="35" ry="25" fill="#F28D35"/>
  <!-- Sprinkles on Donut -->
  <circle cx="640" cy="190" r="5" fill="#FFFFFF"/>
  <circle cx="720" cy="200" r="5" fill="#FFD166"/>
  <circle cx="650" cy="240" r="5" fill="#06D6A0"/>
  <circle cx="710" cy="245" r="5" fill="#118AB2"/>

  <!-- Pink Bowl (Potinho Rosa) -->
  <ellipse cx="700" cy="380" rx="45" ry="25" fill="#FF85A1"/>
  <ellipse cx="700" cy="375" rx="38" ry="18" fill="#52B788"/> <!-- Water -->

  <!-- Gray Towel -->
  <rect x="100" y="320" width="200" height="140" rx="15" fill="#A0AAB2"/>

  <!-- Vida in Rehabilitation Diaper (Fraldinha) -->
  <!-- Main Body -->
  <path d="M 180,200 Q 320,160 480,210 Q 540,250 510,320 Q 400,360 220,320 Q 150,280 180,200 Z" fill="url(#fur2)"/>
  <!-- Diaper (Fralda branca com abas de ajuste) -->
  <path d="M 220,220 Q 280,200 350,230 L 330,330 Q 250,340 210,300 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="3"/>
  <!-- Diaper tape tabs -->
  <rect x="290" y="240" width="30" height="15" rx="4" fill="#3B82F6"/>

  <!-- Front Legs resting -->
  <path d="M 450,280 L 560,300 Q 570,310 550,320 L 440,300 Z" fill="#FFFFFF"/>
  <path d="M 430,295 L 530,325 Q 540,335 520,340 L 420,310 Z" fill="#FAF0DD"/>

  <!-- Head lying comfortably -->
  <path d="M 460,200 Q 530,180 580,220 Q 560,260 490,250 Z" fill="#FFFFFF"/>
  <!-- Snout -->
  <ellipse cx="575" cy="225" rx="14" ry="10" fill="#D98A8A"/>
  <!-- Ear -->
  <path d="M 470,180 L 500,135 L 515,185 Z" fill="#EAD7BC"/>
  <!-- Soft eyes closed in peace -->
  <path d="M 530,205 Q 542,212 552,205" stroke="#5C4033" stroke-width="3" fill="none"/>

  <!-- Badge Overlay -->
  <rect x="20" y="20" width="410" height="40" rx="8" fill="#0B2343" opacity="0.9"/>
  <text x="35" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">2. Quarto de Hospital • Tatame &amp; Fraldinha</text>
</svg>
